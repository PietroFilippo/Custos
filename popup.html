<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custos</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <img src="icons/custos.svg" alt="" width="26" height="26">
    <h1>Custos</h1>
    <span id="headerSummary" class="header-summary"></span>
  </header>

  <main class="scroll">
    <p id="error" class="error" role="status" hidden>Unable to refresh. Retrying…</p>
    <p id="privateNote" class="notice" hidden>Not active in private windows. Allow it in about:addons → Custos.</p>
    <section aria-labelledby="protectionTitle">
      <h2 id="protectionTitle">Protection</h2>
      <ul id="protection" class="overview"></ul>
    </section>
    <section aria-labelledby="currentTitle">
      <h2 id="currentTitle">This site</h2>
      <div id="current"></div>
    </section>

    <section id="activeSection" aria-labelledby="activeTitle" hidden>
      <h2 id="activeTitle">Tracked sites <span id="activeCount" class="count"></span></h2>
      <div id="active"></div>
      <button id="activeMore" class="more" type="button" aria-controls="active" aria-expanded="false" hidden></button>
    </section>

    <section id="blockSection" aria-labelledby="blockTitle" hidden>
      <h2 id="blockTitle">Blocked <span id="blockCount" class="count"></span></h2>
      <div id="blocks"></div>
      <button id="blockMore" class="more" type="button" aria-controls="blocks" aria-expanded="false" hidden></button>
    </section>
  </main>

  <footer class="popup-footer">
    <button id="openOptions" class="primary-action" type="button">Open settings <span aria-hidden="true">→</span></button>
  </footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
